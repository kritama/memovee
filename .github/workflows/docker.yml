name: Build and Push Docker Image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: namespace-profile-default
            architecture: linux-amd64
          - platform: linux/arm64
            runner: namespace-profile-default-arm64
            architecture: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          platforms: ${{ matrix.platform }}

  create-manifest:
    name: Create and Push Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine mutable image aliases
        id: aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"

          if ! [[ "$RELEASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must use MAJOR.MINOR.PATCH format"
            exit 1
          fi

          RELEASE_MAJOR="${BASH_REMATCH[1]}"
          RELEASE_MINOR="${BASH_REMATCH[2]}"
          UPDATE_MINOR=false
          UPDATE_MAJOR=false
          UPDATE_LATEST=false

          if [ "$RELEASE_PRERELEASE" != "true" ]; then
            RELEASE_TAGS=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')

            RELEASE_VERSIONS=$(printf '%s\n' "$RELEASE_TAGS" | \
              sed 's/^v//' | \
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
            RELEASE_VERSIONS=$(printf '%s\n%s\n' "$RELEASE_VERSIONS" "$RELEASE_VERSION" | \
              sed '/^$/d' | \
              sort -Vu)

            LATEST_MINOR=$(printf '%s\n' "$RELEASE_VERSIONS" | \
              awk -F. -v major="$RELEASE_MAJOR" -v minor="$RELEASE_MINOR" \
                '$1 == major && $2 == minor' | \
              tail -n 1)
            LATEST_MAJOR=$(printf '%s\n' "$RELEASE_VERSIONS" | \
              awk -F. -v major="$RELEASE_MAJOR" '$1 == major' | \
              tail -n 1)
            LATEST_VERSION=$(printf '%s\n' "$RELEASE_VERSIONS" | tail -n 1)

            [ "$RELEASE_VERSION" = "$LATEST_MINOR" ] && UPDATE_MINOR=true
            [ "$RELEASE_VERSION" = "$LATEST_MAJOR" ] && UPDATE_MAJOR=true
            [ "$RELEASE_VERSION" = "$LATEST_VERSION" ] && UPDATE_LATEST=true
          fi

          echo "update_minor=$UPDATE_MINOR" >> "$GITHUB_OUTPUT"
          echo "update_major=$UPDATE_MAJOR" >> "$GITHUB_OUTPUT"
          echo "update_latest=$UPDATE_LATEST" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.aliases.outputs.update_minor }}
            type=semver,pattern={{major}},enable=${{ steps.aliases.outputs.update_major }}
            type=raw,value=latest,enable=${{ steps.aliases.outputs.update_latest }}

      - name: Create and push multi-arch manifest
        env:
          MANIFEST_TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_TAG: ${{ github.event.release.tag_name }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" \
              "$SOURCE_IMAGE:$SOURCE_TAG-linux-amd64" \
              "$SOURCE_IMAGE:$SOURCE_TAG-linux-arm64"
          done <<< "$MANIFEST_TAGS"
