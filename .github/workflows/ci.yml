name: "CI"

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    container:
      image: elixir:1.20.3-otp-29
    env:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install CI Tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends zstd
          mix local.hex --force
          mix local.rebar --force

      - name: Retrieve Cached Dependencies
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-debian-elixir-image-test-${{ hashFiles('mise.toml') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-debian-elixir-image-test-${{ hashFiles('mise.toml') }}-

      - name: Install Dependencies
        run: |
          mkdir -p priv/plts
          mix deps.get
          mix compile --warnings-as-errors
          mix dialyzer --plt

      - name: Check Code Format
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Run Dialyzer
        run: mix dialyzer --no-check

      - name: Run Tests
        run: mix test --trace --slowest 10
