name: Create Release from Tag

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    container:
      image: elixir:1.20.3-otp-29
    env:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      MIX_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install CI Tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends zstd
          mix local.hex --force
          mix local.rebar --force

      - name: Retrieve Cached Dependencies
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-debian-elixir-image-release-${{ hashFiles('mise.toml') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-debian-elixir-image-release-${{ hashFiles('mise.toml') }}-

      - name: Install Dependencies
        run: |
          mix deps.get
          mix compile --warnings-as-errors

      - name: Run Tests
        run: mix test --trace --slowest 10

  create-release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "## Changes" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges >> CHANGELOG.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            --draft
