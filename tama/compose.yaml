# Local override of Tama Kit output: Caddy depends on containerized Memovee.
services:
  tama-postgres:
    image: pgvector/pgvector:0.8.6-pg15-bookworm
    restart: unless-stopped
    env_file:
      - ./.tama.postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tama-postgres-data:/var/lib/postgresql/data
    labels:
      dev.upmaru.tama-kit.managed: "true"

  tama:
    build:
      context: .
      dockerfile: ./tama-local-ca.Dockerfile
    image: ghcr.io-upmaru-tama-0.13.4-server-local-ca
    restart: unless-stopped
    env_file:
      - ./.tama.env
    depends_on:
      tama-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    labels:
      dev.upmaru.tama-kit.managed: "true"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      tama:
        condition: service_healthy
      memovee:
        condition: service_healthy
    ports:
      - "127.0.0.1:443:443"
      - "[::1]:443:443"
    networks:
      default:
        aliases:
          - app.localhost
          - tama.app.localhost
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/tama-kit/tls:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "--timeout=5", "https://tama.app.localhost:443/"]
      interval: 5s
      timeout: 6s
      start_period: 5s
      retries: 12
    labels:
      dev.upmaru.tama-kit.managed: "true"

volumes:
  tama-postgres-data:
    labels:
      dev.upmaru.tama-kit.managed: "true"
