# Route the existing Caddy service to Phoenix running on the host.
# Use with compose.yaml and compose.tama.yaml; start services explicitly so
# Caddy's containerized Memovee dependency is not started for this host setup.
services:
  caddy:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MEMORY_PROVIDER_HOST: ${MEMORY_PROVIDER_HOST:-app.localhost}
      MEMORY_TAMA_HOST: ${MEMORY_TAMA_HOST:-tama.app.localhost}
    volumes:
      - ./scripts/memory/Caddyfile:/etc/caddy/Caddyfile:ro
