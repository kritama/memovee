name: kritama-memovee

services:
  memory-redis:
    image: redis:8.2.1
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - memovee-memory-redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, PING]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  memovee-memory-redis-data:
    name: memovee-memory-redis-data
